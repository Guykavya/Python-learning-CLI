# =====================================================================
#  PYTHON MASTERY SYLLABUS  (DRAFT v0.2 for review)
# ---------------------------------------------------------------------
#  v0.2 changes: fixed learning order, basic testing and typing moved
#  early, shared SQL and data-workflow modules, analytical-thinking and
#  ML-evaluation modules, backend reliability, LLM route split from the
#  deep-learning route, priorities and learning outcomes per module.
# =====================================================================

meta:
  version: 0.2
  status: draft

  # Which tracks make up each of your four levels. DSA runs alongside all.
  levels:
    software_engineer: [core, shared, swe]
    data_analyst: [core, shared, da]
    data_scientist: [core, shared, da, ds]
    ai_ml_engineer:
      deep_learning_route: [core, shared, ds, ml]
      llm_application_route: [core, shared, swe, llm]
    always_parallel: [dsa]

  priority_levels:
    essential: Everyone on this path should master it.
    role-specific: Needed for one level, skippable for others.
    advanced-elective: Deep material. Valuable, never a blocker for building things.

  problem_tiers:
    drill: Exercises one concept in isolation.
    applied: A realistic small task using the concept.
    deep: Explain, debug, trace or compare. Edge cases and internals.
    challenge: An unfamiliar combination with earlier topics.

  # Every module is assessed with these four, on top of its problems.
  # Finishing the problem count alone does not mark a module as mastered.
  assessment:
    explain: Explain the core concept in your own words (written answer).
    trace: Predict the output of unfamiliar code without running it.
    fix: Find and fix the bug in a provided program.
    build: Build a small feature independently, no hints.

  # common_mistakes are written per topic when the chapter is authored,
  # and per problem in its mistakes.md file.

  prerequisite_rules:
    requires: All listed modules suggested first.
    requires_any: Any one of the listed modules is enough.
    note: Prerequisites are suggestions. Nothing is ever locked.

tracks:
# ---------------------------------------------------------------------
# CORE PYTHON
# ---------------------------------------------------------------------
  - id: core
    title: Core Python
    description: The language itself, from the first program to CPython internals.
    modules:
      - id: core.01
        title: Getting started and tooling
        priority: essential
        requires: []
        topics:
          - What Python is, interpreters (CPython, PyPy), Python versions
          - Installing and managing Python versions on Linux (uv, pyenv)
          - The REPL, running scripts, the shebang line
          - VS Code setup (interpreter, linting, debugger)
          - Virtual environments and pip basics
          - Terminal basics (paths, ls, cd, pipes, environment variables)
          - Git basics (init, add, commit, log, diff, branch)
          - Reading a traceback, help(), dir(), type()
          - PEP 8 and the Zen of Python
        learning_outcomes:
          - Create a virtual environment, install a package and run a script from the terminal
          - Read a traceback and point to the exact failing line
          - Commit work with Git and view its history
        problems: 25
        project: Personal CLI script that prints system and environment info

      - id: core.02
        title: Objects, variables, numbers and basic I/O
        priority: essential
        requires: [core.01]
        topics:
          - print() in depth (sep, end, file) and input()
          - Converting user input and handling invalid input
          - Everything is an object (identity, type, value)
          - Names and binding, assignment is not copying
          - Mutable vs immutable objects
          - int with arbitrary precision, floor division and modulo with negatives
          - float and IEEE 754, rounding errors, math.isclose
          - decimal and fractions, complex numbers
          - bool, None, truthiness
          - Operators, precedence, chained comparisons, bitwise operators
          - Type conversion rules
          - Augmented assignment and the walrus operator
          - is vs ==
        learning_outcomes:
          - Read numbers from the user safely and reject invalid input
          - Explain why 0.1 + 0.2 != 0.3 and choose decimal when money is involved
          - Predict the result of floor division and modulo with negative numbers
        problems: 50
        project: Unit converter and precise money calculator with input validation

      - id: core.03
        title: Strings and text
        priority: essential
        requires: [core.02]
        topics:
          - String literals, escapes, raw strings, multiline strings
          - Indexing and slicing in depth
          - String methods (split, join, strip, find, replace, partition and more)
          - f-strings and the format specification mini-language
          - Immutability and efficient string building
          - Unicode, code points, encode/decode, UTF-8
          - bytes and bytearray
          - The string and textwrap modules, str.translate
        learning_outcomes:
          - Slice and transform strings without loops where a method exists
          - Format numbers, dates and tables with f-strings
          - Explain the difference between str and bytes and fix an encoding error
        problems: 55
        project: Text statistics tool (word counts, frequencies, formatted report)

      - id: core.04
        title: Control flow and essential built-ins
        priority: essential
        requires: [core.02]
        topics:
          - if / elif / else and conditional expressions
          - while loops, for loops, range in depth
          - break, continue, pass, loop else clauses
          - Nested loops and loop design
          - enumerate(), zip(), reversed()
          - any(), all(), sum(), min(), max() with key functions
          - Structural pattern matching (match / case)
          - Common loop patterns (accumulate, search, count, flag)
        learning_outcomes:
          - Choose between for and while and write loops without off-by-one errors
          - Replace manual index loops with enumerate and zip
          - Use match/case to destructure simple data
        problems: 60
        project: Number guessing game and menu-driven calculator

      - id: core.05
        title: Built-in collections
        priority: essential
        requires: [core.04]
        topics:
          - Lists (methods, slicing assignment, nesting, complexity)
          - Shallow vs deep copy, aliasing bugs
          - "Nested-list aliasing such as [[0] * 3] * 3"
          - Tuples, packing and unpacking, star unpacking
          - namedtuple
          - Dicts (hashing, insertion order, views, methods, merging)
          - Hashability rules, what can be a dict key or set member and why
          - Sets and frozensets, set algebra
          - List, dict and set comprehensions, nested comprehensions
          - Sorting (sort vs sorted, key functions, stability)
          - Big-O of collection operations and choosing the right structure
        learning_outcomes:
          - Pick the right collection for a task and justify it by its operations' cost
          - Explain and fix the [[0] * 3] * 3 bug
          - Explain why a list cannot be a dict key but a tuple of ints can
        problems: 70
        project: Contact book and inventory manager (in memory)

      - id: core.06
        title: Functions
        priority: essential
        requires: [core.05]
        topics:
          - Defining and calling, return values, docstrings
          - Positional, keyword and default arguments
          - The mutable default argument trap
          - "*args, **kwargs, positional-only and keyword-only parameters"
          - Argument passing through object references
          - Mutation vs rebinding inside a function
          - Scope and the LEGB rule, global and nonlocal
          - Functions as first-class objects
          - lambda, map, filter, functools.reduce
          - Closures and late binding
          - Recursion, base cases, recursion limit
        learning_outcomes:
          - Predict whether a function call changes the caller's data
          - Write a closure and explain the late-binding trap
          - Design a function signature that is hard to misuse
        problems: 70
        project: Text-adventure engine driven by functions and dicts

      - id: core.07
        title: Basic error handling
        priority: essential
        requires: [core.06]
        topics:
          - What exceptions are, the built-in exception hierarchy
          - try / except / else / finally
          - Catching specific exceptions, why bare except is dangerous
          - Raising exceptions with useful messages
          - EAFP vs LBYL
          - assert and when not to use it
        learning_outcomes:
          - Handle the exact exceptions a piece of code can raise and nothing more
          - Explain when else and finally run
          - Write error messages that tell the user what to do
        problems: 35
        project: Robust input-driven quiz program that never crashes

      - id: core.08
        title: Testing basics with pytest
        priority: essential
        requires: [core.07]
        topics:
          - Why test, what a test is
          - Writing assert-based tests and running pytest
          - Reading pytest failure output
          - parametrize for many cases
          - Testing that exceptions are raised
          - Boundary cases and choosing useful tests
          - Writing tests before code (TDD intro)
        learning_outcomes:
          - Write a pytest file for a function, covering normal, boundary and error cases
          - Read a failing test report and locate the bug
          - Decide which cases are worth testing
        problems: 30
        project: Test suite for your own earlier projects

      - id: core.09
        title: Type hints basics
        priority: essential
        requires: [core.06]
        topics:
          - Annotating variables, parameters and return values
          - Collection annotations (list[int], dict[str, float], tuple[int, ...])
          - Optional values and unions with the | operator
          - Type hints do not validate input at runtime
          - Running mypy and reading its errors
        learning_outcomes:
          - Annotate a module so mypy passes
          - Explain why a wrong type still runs, and what tool would reject it at runtime
        problems: 25
        project: Add type hints to two earlier projects

      - id: core.10
        title: Iterators and generators
        priority: essential
        requires: [core.06]
        topics:
          - The iteration protocol (__iter__, __next__, StopIteration)
          - Iterable vs iterator
          - Generator functions and yield
          - Generator expressions and lazy evaluation
          - yield from, send, throw, close
          - Infinite sequences and data pipelines
          - itertools in depth (chain, islice, groupby, product, permutations and more)
        learning_outcomes:
          - Process data larger than memory with generators
          - Explain why an iterator can be consumed only once
          - Build a pipeline with itertools instead of nested loops
        problems: 50
        project: Lazy log-file processing pipeline

      - id: core.11
        title: Decorators and functional tools
        priority: essential
        requires: [core.10]
        topics:
          - Function decorators from scratch
          - Decorators with arguments, stacking decorators
          - functools.wraps and metadata
          - functools (lru_cache, cache, partial, singledispatch)
          - The operator module
          - Functional programming style in Python
        learning_outcomes:
          - Write a decorator with arguments that preserves the wrapped function's metadata
          - Explain the order in which stacked decorators run
        problems: 40
        project: Decorator toolkit (timer, retry, cache, rate limiter, logger)

      - id: core.12
        title: Files and I/O
        priority: essential
        requires: [core.07]
        topics:
          - open(), modes, text vs binary, encodings
          - Context managers and the with statement
          - FileNotFoundError, PermissionError and other OS errors
          - Streaming large files line by line or in chunks
          - Safe overwrites (write to a temp file, then replace)
          - pathlib in depth, os and shutil, glob
          - CSV, JSON, TOML (tomllib), configparser
          - pickle and its security risks
          - tempfile, standard streams (stdin, stdout, stderr)
          - argparse for command-line tools
        learning_outcomes:
          - Read a multi-gigabyte file without loading it into memory
          - Update a file so a crash midway never corrupts it
          - Build a CLI tool with arguments and helpful errors
        problems: 50
        project: File organiser CLI (sort files by type, date, size)

      - id: core.13
        title: Modules, packages and environments
        priority: essential
        requires: [core.12]
        topics:
          - How import works, sys.path, module caching
          - "The if __name__ == '__main__' idiom"
          - Packages, __init__.py, relative imports, namespace packages
          - __all__ and public APIs, circular imports
          - importlib and dynamic imports
          - pyproject.toml, building a package
          - pip, uv, poetry, dependency pinning and lock files
        learning_outcomes:
          - Split a script into a package with clean imports
          - Diagnose and fix a circular import
          - Build an installable package from pyproject.toml
        problems: 30
        project: Package one of your utilities and install it in a fresh environment

      - id: core.14
        title: Object-oriented programming fundamentals
        priority: essential
        requires: [core.11]
        topics:
          - Classes, instances, attributes, methods, self
          - __init__ and object construction
          - Class vs instance attributes
          - classmethod and staticmethod
          - Properties and encapsulation conventions, name mangling
          - Inheritance, super(), method overriding
          - Multiple inheritance, MRO, mixins
          - Composition vs inheritance
          - Abstract base classes (abc), polymorphism, duck typing
          - Custom exception classes and exception hierarchies
          - Exception chaining (raise from), exception groups and except*
        learning_outcomes:
          - Model a real domain with classes and decide composition vs inheritance
          - Design a custom exception hierarchy for a library
          - Predict method resolution order in a diamond inheritance
        problems: 70
        project: Library management system with custom exceptions

      - id: core.15
        title: Python data model essentials
        priority: essential
        requires: [core.14]
        topics:
          - __repr__ vs __str__, __format__
          - Equality and hashing (__eq__, __hash__), rich comparisons, total_ordering
          - Operator overloading (arithmetic, reflected, in-place)
          - Container protocols (__len__, __getitem__, __contains__, __iter__)
          - __call__ and class-based decorators, decorating classes
          - Context manager protocol (__enter__, __exit__) and contextlib
          - dataclasses in depth, enum
          - __slots__ and memory
        learning_outcomes:
          - Make a custom class behave like a built-in container
          - Explain why defining __eq__ removes __hash__
          - Write a context manager as a class and with contextlib
        problems: 55
        project: Vector and matrix library with operator overloading

      - id: core.16
        title: Advanced typing
        priority: role-specific
        requires: [core.09, core.14]
        topics:
          - Generics, TypeVar, the type statement and type aliases
          - Protocols and structural typing
          - TypedDict, Literal, Final, Callable, ParamSpec, overload
          - Type narrowing (isinstance, guards, TypeGuard / TypeIs)
          - Any vs object
          - Typing third-party libraries, stub files, py.typed
          - Gradual typing strategy for an existing codebase
        learning_outcomes:
          - Write a generic, fully typed container class
          - Explain when to use Protocol instead of a base class
          - Get a real project clean under mypy strict
        problems: 35
        project: Fully typed refactor of an earlier project (mypy strict clean)

      - id: core.17
        title: Standard library deep tour
        priority: essential
        requires: [core.12]
        topics:
          - collections (Counter, defaultdict, deque, OrderedDict, ChainMap)
          - heapq and bisect
          - datetime, zoneinfo, time
          - math, statistics, random, secrets
          - copy, pprint
          - subprocess, sys, os, shlex
          - hashlib, uuid, base64, struct
          - sqlite3, zipfile, shutil archives
          - urllib and http basics
          - logging in depth
        learning_outcomes:
          - Reach for the right standard-library tool before writing your own
          - Handle time zones correctly with zoneinfo
          - Set up logging with levels, handlers and formatting
        problems: 60
        project: Backup and log-rotation tool

      - id: core.18
        title: Regular expressions and text processing
        priority: essential
        requires: [core.03, core.07]
        topics:
          - re module, patterns, character classes, quantifiers
          - Groups, named groups, backreferences
          - Lookahead and lookbehind
          - Greedy vs lazy, flags, verbose patterns
          - re.sub with functions, compiling patterns
          - Catastrophic backtracking and when not to use regex
        learning_outcomes:
          - Extract structured fields from messy text with named groups
          - Explain why a pattern is slow and rewrite it
        problems: 45
        project: Log analyser that extracts structured data with regex

      - id: core.19
        title: Advanced testing
        priority: essential
        requires: [core.08, core.14]
        topics:
          - Unit vs integration vs end-to-end tests
          - pytest fixtures in depth, scopes, conftest.py
          - markers, tmp_path, monkeypatch, capsys
          - Mocking with unittest.mock and when mocking hurts
          - Coverage and what it does not prove
          - Property-based testing with hypothesis
          - Testing code with time, randomness, files and network
        learning_outcomes:
          - Choose the right test level for a given risk
          - Test code that talks to files, time and the network without real side effects
        problems: 40
        project: Write a full test suite for a provided buggy codebase

      - id: core.20
        title: Debugging, profiling and code quality
        priority: essential
        requires: [core.19]
        topics:
          - breakpoint(), pdb, VS Code debugger
          - Logging as a debugging tool
          - timeit, cProfile, line-level profiling
          - Memory profiling with tracemalloc
          - ruff, black, mypy, pre-commit hooks
          - Reading other people's code
        learning_outcomes:
          - Find a bug with the debugger instead of print statements
          - Profile a slow program, find the hot spot and measure the improvement
        problems: 30
        project: Profile a slow program and measurably speed it up

      - id: core.21
        title: Concurrency and parallelism
        priority: essential
        requires: [core.17, core.14]
        topics:
          - Processes vs threads, CPU-bound vs I/O-bound
          - The GIL and free-threaded Python
          - threading, locks, events, semaphores, queue
          - Race conditions and deadlocks
          - multiprocessing and shared state
          - concurrent.futures
          - asyncio (event loop, coroutines, tasks, gather, TaskGroup, timeouts)
          - Cancellation and cleanup in async code
          - Bounded concurrency with semaphores and worker pools
          - Blocking calls inside async functions and how to offload them
          - Async iterators and async context managers
          - httpx for async HTTP
        learning_outcomes:
          - Pick threads, processes or asyncio for a given workload and justify it
          - Limit concurrent requests and cancel work cleanly on timeout
          - Spot a blocking call that freezes an event loop
        problems: 50
        project: Concurrent web downloader with limits, retries and clean cancellation

      - id: core.22
        title: Pythonic design and patterns
        priority: essential
        requires: [core.15, core.19]
        topics:
          - Pythonic idioms and anti-patterns
          - SOLID principles applied in Python
          - Design patterns taught problem-first (strategy, factory, observer, adapter, command)
          - Dependency injection without frameworks
          - Clean code and refactoring techniques
        learning_outcomes:
          - Name the problem a pattern solves before applying it
          - Refactor a script safely with tests in place
        problems: 30
        project: Refactor a messy legacy script into a clean package

      - id: core.23
        title: Attribute machinery and metaprogramming
        priority: advanced-elective
        requires: [core.15]
        topics:
          - Attribute lookup (__getattr__, __getattribute__, __setattr__, __delattr__)
          - Descriptors and how properties, methods and classmethods really work
          - __init_subclass__, __class_getitem__, __set_name__
          - Metaclasses and the class creation process
          - When metaprogramming is the wrong choice
        learning_outcomes:
          - Explain how a function becomes a bound method
          - Build a validated-field system with descriptors
        problems: 35
        project: Mini ORM using descriptors

      - id: core.24
        title: CPython internals
        priority: advanced-elective
        requires: [core.23, core.21]
        topics:
          - CPython architecture, source to bytecode
          - The dis module and reading bytecode
          - Frames, the evaluation loop, specialising adaptive interpreter
          - Memory management, reference counting, garbage collector and cycles
          - Interning, small-int cache, object layout, sys.getsizeof
          - How dict, list and set are implemented
          - The experimental JIT and free-threading internals
          - C extensions overview, ctypes, Cython overview
        learning_outcomes:
          - Read bytecode for a function and explain what the interpreter does
          - Explain why a reference cycle needs the garbage collector
        problems: 35
        project: Mini stack-based bytecode interpreter in Python
    capstone: Full-featured CLI application (packaged, typed, tested, documented)

# ---------------------------------------------------------------------
# SHARED FOUNDATIONS (used by SWE, DA, DS and AI)
# ---------------------------------------------------------------------
  - id: shared
    title: Shared data foundations
    description: SQL and data workflows every level needs, taught once.
    modules:
      - id: shared.01
        title: SQL foundations
        priority: essential
        requires: [core.12]
        topics:
          - Relational model, tables, primary and foreign keys
          - SELECT, WHERE, ORDER BY, LIMIT
          - NULL semantics and three-valued logic
          - Joins (inner, left, full, self, cross) and join fan-out
          - Aggregates, GROUP BY, HAVING, COUNT DISTINCT
          - Subqueries and CTEs
          - Window functions
          - INSERT, UPDATE, DELETE, basic schema design
          - Indexes and transactions (introduction)
          - Using SQL from Python with sqlite3
          - Dialect differences (SQLite, MySQL, PostgreSQL)
        learning_outcomes:
          - Answer a multi-table business question in one query
          - Explain why a join changed a count and fix it
          - Handle NULLs correctly in filters and aggregates
        problems: 70
        project: Library or store database answered entirely in SQL

      - id: shared.02
        title: Data workflows and pipelines
        priority: essential
        requires: [shared.01, core.17]
        topics:
          - Getting data from APIs with httpx, including pagination
          - ETL vs ELT
          - Schema checks and data-quality checks
          - Incremental loads, deduplication, repeatable runs
          - Retries, checkpoints, logging, failed-record handling
          - CSV vs Parquet, basic partitioning
          - Data access permissions and handling sensitive data
        learning_outcomes:
          - Build a pipeline that can be re-run safely without duplicating data
          - Resume a failed run from a checkpoint
          - Quarantine bad records instead of crashing
        problems: 35
        project: Incremental pipeline from a public API into SQLite and Parquet
    capstone: null

# ---------------------------------------------------------------------
# DATA STRUCTURES AND ALGORITHMS
# ---------------------------------------------------------------------
  - id: dsa
    title: Data Structures and Algorithms
    description: Starts with plain problem solving early, then pattern-based DSA with LeetCode, Codeforces and CSES mapped in.
    modules:
      - id: dsa.00
        title: Problem-solving basics
        priority: essential
        requires: [core.04]
        topics:
          - Reading a problem, inputs, outputs and constraints
          - Breaking a problem into steps, pseudocode
          - Dry runs and tracing by hand
          - Edge-case thinking
          - Logic problems with loops (digits, patterns, primes, series)
        learning_outcomes:
          - Write a plan before code for any small problem
          - Trace a loop by hand and find an off-by-one bug
        problems: 60
        external: true

      - id: dsa.01
        title: Complexity analysis
        priority: essential
        requires: [core.05, dsa.00]
        topics:
          - Big-O, Big-Theta, Big-Omega
          - Time and space complexity, amortised analysis
          - Analysing recursion, recurrence relations, master theorem
          - Python-specific costs of operations
          - Using constraints to guess the required complexity
        learning_outcomes:
          - State the complexity of any solution you write
          - Tell from constraints whether O(n squared) will pass
        problems: 30
        external: true

      - id: dsa.02
        title: Math for DSA
        priority: essential
        requires: [dsa.01]
        topics:
          - Primes, sieve of Eratosthenes, factorisation
          - GCD, LCM, extended Euclid
          - Modular arithmetic, fast exponentiation, modular inverse
          - Combinatorics (nCr, Pascal triangle)
          - Bit manipulation tricks
        learning_outcomes:
          - Solve counting problems under a modulus without overflow thinking errors
        problems: 40
        external: true

      - id: dsa.03
        title: Arrays and strings patterns
        priority: essential
        requires: [dsa.01]
        topics:
          - Prefix sums and difference arrays
          - Two pointers
          - Sliding window (fixed and variable)
          - Kadane's algorithm
          - Matrix traversal and manipulation
        learning_outcomes:
          - Recognise when two pointers or a sliding window applies
          - Turn an O(n squared) scan into O(n) with prefix sums
        problems: 60
        external: true

      - id: dsa.04
        title: Hashing
        priority: essential
        requires: [dsa.03]
        topics:
          - Hash map and hash set patterns
          - Frequency counting, grouping, anagrams
          - Implementing a hash table from scratch
          - Rolling hash and string hashing
        learning_outcomes:
          - Use a hash map to remove a nested loop
        problems: 40
        external: true

      - id: dsa.05
        title: Sorting
        priority: essential
        requires: [dsa.03]
        topics:
          - Bubble, selection, insertion sort
          - Merge sort and quick sort (implement both)
          - Heap sort, counting sort, radix sort
          - Custom comparators, stability
          - Interval problems (merge, insert, overlap)
        learning_outcomes:
          - Implement merge sort and quick sort from memory
          - Solve interval problems by sorting first
        problems: 40
        external: true

      - id: dsa.06
        title: Binary search
        priority: essential
        requires: [dsa.05]
        topics:
          - Classic binary search and off-by-one control
          - Lower and upper bound
          - Binary search on the answer
          - Rotated and unknown-size arrays
        learning_outcomes:
          - Write a bug-free binary search with a clear loop invariant
          - Spot a monotonic condition and binary search on the answer
        problems: 40
        external: true

      - id: dsa.07
        title: Recursion and backtracking
        priority: essential
        requires: [dsa.01, core.06]
        topics:
          - Recursion trees
          - Subsets, permutations, combinations
          - N-Queens, Sudoku, word search
          - Pruning techniques
        learning_outcomes:
          - Draw the recursion tree of a backtracking solution
          - Generate all valid configurations with pruning
        problems: 45
        external: true

      - id: dsa.08
        title: Stacks and queues
        priority: essential
        requires: [dsa.03]
        topics:
          - Stacks with lists, queues with collections.deque
          - Monotonic stack and monotonic queue
          - Expression parsing and evaluation
          - Next greater element family
        learning_outcomes:
          - Recognise next-greater style problems and solve them with a monotonic stack
        problems: 40
        external: true

      - id: dsa.09
        title: Linked lists
        priority: essential
        requires: [core.14, dsa.03]
        topics:
          - Singly and doubly linked lists from scratch
          - Fast and slow pointers, cycle detection
          - Reversal, merging, reordering
          - Linked-list based stacks and queues
          - LRU cache
        learning_outcomes:
          - Reverse and merge linked lists without losing nodes
        problems: 35
        external: true

      - id: dsa.10
        title: Trees
        priority: essential
        requires: [dsa.07, dsa.08]
        topics:
          - Binary tree traversals (recursive and iterative)
          - Binary search trees (insert, delete, validate)
          - Height, diameter, paths, lowest common ancestor
          - Serialisation and construction from traversals
          - Balanced trees overview (AVL, red-black)
        learning_outcomes:
          - Solve tree problems by defining what each recursive call returns
        problems: 60
        external: true

      - id: dsa.11
        title: Heaps and priority queues
        priority: essential
        requires: [dsa.10]
        topics:
          - Binary heap from scratch, heapq
          - Top-K problems
          - Two-heaps median, merge K sorted
        learning_outcomes:
