[project]
name = "learn-engine"
version = "0.1.0"
description = "Offline Python learning module: syllabus, problems, tracker and daily planner."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pytest>=8.0",
    "pygments>=2.0",
    # Windows ships no time-zone database; zoneinfo (core.17) needs this package there.
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
learn = "learn.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["engine"]
include = ["learn*"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
