# Real site problems for dsa.10 (Trees).
# Verification: every LeetCode slug and the CSES id below were written from memory (from the problem plan) and NOT
# re-fetched (no web access was used while writing). Fix any slug or id that fails to open.
# Codeforces problems are left out on purpose: none were verified. CSES 1130 (Tree Matching) is left out too: it needs
# a greedy idea that this module does not teach.
# Order follows the chapter: height and mirror (3), iterative inorder (5), level order (6), balance and diameter (7),
