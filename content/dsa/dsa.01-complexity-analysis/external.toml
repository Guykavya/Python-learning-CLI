# Real site problems for dsa.01, all verified to exist (title and difficulty or rating checked).
# LeetCode: Easy and Medium. Codeforces: rating 800 to 1200. CSES: Sorting and Searching, Range Queries.
# In each one the obvious solution checks every pair or rescans the data, and is too slow
# for the given limits. The point is to read the constraints first, name the complexity you
# need (see chapter.md, "Using constraints to choose an approach"), and only then design.

