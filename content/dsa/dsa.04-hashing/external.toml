# Real site problems for dsa.04 (Hashing).
# Verified online (web search, Nov 2026): Codeforces 4C "Registration system" only.
# All other LeetCode slugs, CSES task ids and Codeforces id 1520D were written from memory of the sites and not re-fetched online.
# Titles and ids that failed to open should be fixed here; no Codeforces id was invented, only ones recalled with confidence.
# Already in dsa.03 and therefore left out: subarray-sum-equals-k, find-all-anagrams-in-a-string,
# longest-substring-without-repeating-characters, CSES 1661 Subarray Sums II.
# LeetCode: Easy, Medium and a few Hard. Codeforces: rating about 1200 to 1300. CSES: Sorting and Searching.
# Order follows the chapter: sets and counting (sections 2-5), complement and prefix dictionaries (6-7),
# hash tables and caches (9-10), string hashing (11-12). Write the brute force first, then the hash idea.

